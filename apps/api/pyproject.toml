[project]
name = "citizen-ai"
version = "0.1.0"
description = "Nền tảng chatbot đa phường"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2", "uvicorn[standard]==0.54.0", "pydantic==2.14.3",
  "pydantic-settings==2.16.2", "sqlalchemy==2.1.8", "alembic==1.20.1",
  "psycopg[binary]==3.3.8", "celery==5.7.0", "redis==8.1.0",
  "argon2-cffi==25.1.0", "openai==3.49.0", "boto3==1.43.127", "packaging==26.3",
  "httpx==0.28.1", "python-multipart==0.0.33", "pypdf==7.0.1", "pypdfium2==5.15.2",
  "python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2", "Pillow==13.0.0",
  "beautifulsoup4==4.15.0", "defusedxml==0.7.1", "charset-normalizer==3.5.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1", "reportlab==5.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citizen_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and Redis", "live: explicitly opt-in paid API evaluation"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "defusedxml.*", "openpyxl.*", "pypdfium2.*"]
follow_untyped_imports = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
