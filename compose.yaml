name: ai-citizen-platform
x-runtime: &runtime
  APP_ENV: ${APP_ENV:-local}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
  DATABASE_URL: ${DATABASE_URL:?Run bootstrap first}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SESSION_SECRET: ${SESSION_SECRET:?Run bootstrap first}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
  AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2500}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
  EMBEDDING_PROFILE_ID: ${EMBEDDING_PROFILE_ID:-}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-ai-citizen-private}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run bootstrap first}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run bootstrap first}
x-api: &api
  image: ai-citizen-api:local
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile
    target: base
  environment: *runtime
  init: true
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_DB: citizen
      POSTGRES_USER: citizen_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run bootstrap first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U citizen_migrator -d citizen"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.0.2-alpine@sha256:48501c5ad00d5563bc30c075c7bcef41d7d98de3e9a1e6c752068c66f0a8463b
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: ai-citizen-minio:local
    build:
      context: .
      dockerfile: infrastructure/docker/minio.Dockerfile
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run bootstrap first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run bootstrap first}
    volumes: [minio-data:/data]
  migrate:
    <<: *api
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Run bootstrap first}
    command: [alembic, upgrade, head]
  api:
    <<: *api
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *api
    command: [celery, -A, citizen_ai.workers:celery, worker, --loglevel=WARNING, --concurrency=2]
    healthcheck:
      test: [CMD, celery, -A, citizen_ai.workers:celery, inspect, ping, --timeout, "3"]
      interval: 15s
      timeout: 8s
      start_period: 10s
      retries: 6
  scheduler:
    <<: *api
    command: [celery, -A, citizen_ai.workers:celery, beat, --loglevel=WARNING, --schedule=/tmp/citizen-beat]
  ingester:
    <<: *api
    environment:
      <<: *runtime
      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_CHAT_MODEL: ""
      EMBEDDING_PROVIDER: disabled
      EMBEDDING_PROFILE_ID: ""
      EMBEDDING_DIMENSIONS: "0"
    command: [celery, -A, citizen_ai.workers:celery, worker, --loglevel=WARNING, --concurrency=1, --queues=ingestion, --hostname=ingester@%h]
    networks: [default, parsing]
    depends_on:
      migrate: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
      parser: {condition: service_healthy}
  parser:
    image: ai-citizen-parser:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: parser
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    networks: [parsing]
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc
    mem_limit: 4g
    cpus: 2
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
  web:
    image: ai-citizen-web:local
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    init: true
  nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports: ["127.0.0.1:${APP_LOCAL_PORT:-8080}:8080"]
    volumes: [./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
  ops:
    <<: *api
    profiles: [tools]
    user: "0:0"
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Run bootstrap first}
    volumes: [./.local:/app/.local]
    command: [python, -m, citizen_ai.cli, ops, validate-runtime]
  tests:
    <<: *api
    profiles: [test]
    image: ai-citizen-tests:local
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: test
    environment:
      <<: *runtime
      APP_ENV: test
      RUN_DB_TESTS: "1"
      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_CHAT_MODEL: ""
      EMBEDDING_PROVIDER: disabled
      EMBEDDING_PROFILE_ID: ""
      EMBEDDING_DIMENSIONS: "0"
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Run bootstrap first}
    networks: [default, parsing]
    command: [pytest, -q, -p, no:cacheprovider]
volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
networks:
  parsing:
    internal: true
